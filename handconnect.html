<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandConnect - CodeWithSwaroop</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js">
</script>
<style>
html, body {
margin: 0; height: 100%; background: #000;
overflow: hidden; font-family: system-ui, sans-serif;
}
video, canvas {
position: fixed; inset: 0; width: 100%; height: 100%;
object-fit: cover; transform: scaleX(-1);
}
.hud {
position: fixed; left: 16px; min-width: 160px; padding: 8px 12px;
background: rgba(20, 24, 22, .85); color: #ddd;
font-size: 13px; border-radius: 4px;
}
.hud div { display: flex; justify-content: space-between; gap: 24px; line-height: 1.7; }
.hud b { color: #3ef08a; font-weight: 500; }
#msg {
position: fixed; inset: 0; display: grid; place-items: center;
color: #fff; font-size: 18px;
}
</style>
</head>

<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div class="hud" style="top:16px">
<div>Hands Detected:<b id="hn">0</b></div>
<div>FPS:<b id="fps">0</b></div>
</div>
<div class="hud" style="top:84px">
<div>Gesture:<b id="g">-</b></div>
<div>Spread:<b id="sp">0%</b></div>
</div>
<div id="msg">Allow camera access to start</div>
<script>
const video = document.getElementById('v');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TIPS = [4, 8, 12, 16, 20];
const BONES = [
[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8],
[5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15],
[15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]
];
const HAND_COLORS = ['#ff4fd8', '#ffe83a'];
const BEAM_COLORS = ['#ff3b3b', '#ff9a2e', '#7dff5a', '#3ad7ff', '#c46bff'];
let sparks = [];
let last = performance.now();
let fpsSmooth = 0;
function resize() {
canvas.width = innerWidth;
canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();
// Map a landmark (0..1) to canvas pixels, matching object-fit: cover
function toPx(p) {
const vw = video.videoWidth || 1280;
const vh = video.videoHeight || 720;
const s = Math.max(canvas.width / vw, canvas.height / vh);
return {
x: p.x * vw * s - (vw * s - canvas.width) / 2,
y: p.y * vh * s - (vh * s - canvas.height) / 2
};
}
// Coloured glowing line with a thin white core
function glowLine(a, b, color, width) {
ctx.strokeStyle = color;
ctx.lineWidth = width;
ctx.shadowColor = color;
ctx.shadowBlur = 18;
ctx.beginPath();
ctx.moveTo(a.x, a.y);
ctx.lineTo(b.x, b.y);
ctx.stroke();
ctx.strokeStyle = '#fff';
ctx.lineWidth = width / 3;

ctx.shadowBlur = 0;
ctx.stroke();
}
function gesture(lm) {
const d = (i, j) => Math.hypot(lm[i].x - lm[j].x, lm[i].y - lm[j].y);
const open = [8, 12, 16, 20].filter(t => d(t, 0) > d(t - 2, 0)).length;
if (d(4, 8) < 0.05) return 'Pinch';
if (open >= 4) return 'Open Hand';
if (open === 0) return 'Fist';
if (open === 1) return 'Point';
return 'Partial';
}
function addSpark(p, color) {

sparks.push({
x: p.x, y: p.y, life: 1, c: color,
vx: (Math.random() - 0.5) * 6,
vy: (Math.random() - 0.5) * 6
});
}
function drawSparks() {
sparks = sparks.filter(s => (s.life -= 0.04) > 0);
for (const s of sparks) {
s.x += s.vx;
s.y += s.vy;
ctx.globalAlpha = s.life;
ctx.strokeStyle = s.c;
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(s.x, s.y);
ctx.lineTo(s.x - s.vx * 2, s.y - s.vy * 2);
ctx.stroke();
}
ctx.globalAlpha = 1;
}
function updateHud(res, count) {
const now = performance.now();
fpsSmooth = fpsSmooth * 0.9 + (1000 / (now - last)) * 0.1;
last = now;
document.getElementById('hn').textContent = count;
document.getElementById('fps').textContent = Math.round(fpsSmooth);
const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];
document.getElementById('g').textContent = lm ? gesture(lm) : '-';
let spread = 0;
if (lm) {
const d = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
spread = Math.min(100, Math.round(d * 250));
}
document.getElementById('sp').textContent = spread + '%';
}
function onResults(res) {
document.getElementById('msg').style.display = 'none';
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.lineCap = 'round';
const hands = (res.multiHandLandmarks || []).map(lm => lm.map(toPx));
// 1. Neon skeleton for each hand
hands.forEach((pts, h) => {
for (const [a, b] of BONES) glowLine(pts[a], pts[b], HAND_COLORS[h % 2], 4);
});
// 2. Rainbow beams fingertip-to-fingertip when both hands are visible
if (hands.length === 2) {
TIPS.forEach((t, i) => {
glowLine(hands[0][t], hands[1][t], BEAM_COLORS[i], 6);
if (Math.random() < 0.35) addSpark(hands[0][t], BEAM_COLORS[i]);
if (Math.random() < 0.35) addSpark(hands[1][t], BEAM_COLORS[i]);
});
}
// 3. Sparks + HUD
drawSparks();
updateHud(res, hands.length);
}
const tracker = new Hands({
locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f
});
tracker.setOptions({
maxNumHands: 2,
modelComplexity: 1,
minDetectionConfidence: 0.6,
minTrackingConfidence: 0.5
});
tracker.onResults(onResults);

const camera = new Camera(video, {
onFrame: async () => tracker.send({ image: video }),
width: 1280,
height: 720
});
camera.start();
</script>
</body>
</html>
